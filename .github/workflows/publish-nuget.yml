# Publishes the packages of a deployment build to nuget.org with Trusted Publishing.
# AppVeyor builds the packages, attaches them to the GitHub release, and starts this workflow from the Windows Release job
# (see on_success in appveyor.yml). The workflow waits until the whole AppVeyor build has succeeded before pushing.
# nuget.org needs a Trusted Publishing policy for this repository and this workflow file (publish-nuget.yml).
name: Publish to nuget.org

on:
  repository_dispatch:
    types: [appveyor-deployment]

permissions:
  contents: read    # Download the release assets.
  id-token: write   # Request the OIDC token exchanged for a short-lived nuget.org API key.

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.client_payload.tag }}
      APPVEYOR_ACCOUNT: ${{ github.event.client_payload.appveyor_account }}
      APPVEYOR_PROJECT: ${{ github.event.client_payload.appveyor_project }}
      APPVEYOR_BUILD: ${{ github.event.client_payload.appveyor_build }}
      PACKAGE_PREFIX: ${{ github.event.client_payload.package_prefix }}
      PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check the request
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid tag: '$TAG'"; exit 1; }
          [[ "$APPVEYOR_ACCOUNT" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Invalid AppVeyor account: '$APPVEYOR_ACCOUNT'"; exit 1; }
          [[ "$APPVEYOR_PROJECT" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Invalid AppVeyor project: '$APPVEYOR_PROJECT'"; exit 1; }
          [[ "$APPVEYOR_BUILD" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Invalid AppVeyor build: '$APPVEYOR_BUILD'"; exit 1; }
          [[ "$PACKAGE_PREFIX" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Invalid package prefix: '$PACKAGE_PREFIX'"; exit 1; }

      - name: Wait for the AppVeyor build to succeed
        run: |
          url="https://ci.appveyor.com/api/projects/$APPVEYOR_ACCOUNT/$APPVEYOR_PROJECT/build/$APPVEYOR_BUILD"
          for i in $(seq 1 200); do
            status=$(curl -sSf "$url" | jq -r '.build.status') || status=unknown
            echo "AppVeyor build $APPVEYOR_BUILD: $status"
            case "$status" in
              success) exit 0 ;;
              failed|cancelled) echo "The AppVeyor build did not succeed: nothing is published."; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the AppVeyor build."
          exit 1

      - name: Download the packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.nupkg' --pattern '*.snupkg' --dir packages
          ls -l packages
          for package in "$PACKAGE_PREFIX.$PROJECT_NAME.$version.nupkg" "$PACKAGE_PREFIX.$PROJECT_NAME-Debug.$version.nupkg"; do
            [ -f "packages/$package" ] || { echo "Missing release asset: $package"; exit 1; }
          done

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: dlebansais    # nuget.org profile name, not the email address.

      - name: Push the packages
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
