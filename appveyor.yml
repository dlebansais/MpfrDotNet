# version format
version: v{build}

branches:
  only:
    - master
    - deployment

# Do not build on tags
skip_tags: true

# Skipping commits with particular message or from specific user
skip_commits:
  message: "*[skip ci]*"

image:
  - Ubuntu2404
  - Visual Studio 2026

# scripts that are called at very beginning, before repo cloning
init:
  - git config --global core.autocrlf input

environment:
  opencover_version: 4.7.1221
  codecov_uploader_version: 0.8.0
  report_generator_version: 5.5.10
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CUSTOM_PACKAGER_OPTIONS: "[]"           # Override in settings -> Environment -> Environment variables
  PACKAGE_PREFIX: dlebansais
  # GitHub token, the same as the release deployments below, used to start the nuget.org publishing workflow.
  GITHUB_DEPLOY_TOKEN:
    secure: wGFKd2yoaaq7+B6Evl2OZeePPHUzTDlYnDf7DCH26mJZc/nrYGjQ5XGiTZfTWmvW

matrix:
  fast_finish: true     # set this flag to immediately finish build once one of the jobs fails.

# On Linux, the library uses the system GMP and MPFR libraries, and only the net10.0 target is built and tested.
# Packaging and deployment stay on Windows. Each section below replaces the global one.
for:
  - matrix:
      only:
        - image: Ubuntu2404
    install:
      - sudo apt-get update
      - sudo apt-get install -y libgmp10 libmpfr6
      # Install the .NET 10 SDK if the image does not provide it.
      - dotnet --list-sdks | grep -q '^10\.' || (curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir "$HOME/.dotnet")
      - export PATH="$HOME/.dotnet:$PATH"
      - dotnet --list-sdks
    before_build:
      - dotnet restore ./Test/$APPVEYOR_PROJECT_NAME.Test/$APPVEYOR_PROJECT_NAME.Test.csproj -p:Platform=x64
    build_script:
      - dotnet build ./Test/$APPVEYOR_PROJECT_NAME.Test/$APPVEYOR_PROJECT_NAME.Test.csproj -c $CONFIGURATION -p:Platform=x64 --no-restore
    after_build:
      - echo Packaging is done on Windows.
    # Tests run on master only: a deployment build packages code that master has already tested.
    test_script:
      - |
        if [ "$APPVEYOR_REPO_BRANCH" != "deployment" ]; then
          dotnet test --project ./Test/$APPVEYOR_PROJECT_NAME.Test/$APPVEYOR_PROJECT_NAME.Test.csproj -c $CONFIGURATION -p:Platform=x64 -f net10.0 --no-build --output detailed --coverage --coverage-output-format cobertura --coverage-output Coverage-$APPVEYOR_PROJECT_NAME-linux.xml --results-directory TestResults
        fi
    after_test:
      - if [ "$APPVEYOR_REPO_BRANCH" != "deployment" ]; then head -n 3 TestResults/Coverage-*.xml; fi
      # The CodecovUploader NuGet package only contains the Windows uploader: download the Linux build of the same version,
      # and check its checksum before running it. Codecov merges this report with the Windows ones for the same commit.
      - |
        if [ "$CONFIGURATION" = "Debug" ] && [ "$APPVEYOR_REPO_BRANCH" = "master" ]; then
          curl -sSfLO "https://uploader.codecov.io/v${codecov_uploader_version}/linux/codecov" &&
          curl -sSfLO "https://uploader.codecov.io/v${codecov_uploader_version}/linux/codecov.SHA256SUM" &&
          sha256sum -c codecov.SHA256SUM &&
          chmod +x codecov &&
          ./codecov -f "TestResults/Coverage-$APPVEYOR_PROJECT_NAME-linux.xml"
        fi
    deploy: off
    on_success:
      - echo Publishing is started from Windows.

before_build:
  - nuget restore %APPVEYOR_PROJECT_NAME%.slnx
  - nuget install dlebansais.GitCommitId -DependencyVersion Highest -OutputDirectory packages
  - nuget install dlebansais.Packager -DependencyVersion Highest -OutputDirectory packages
  - nuget install OpenCover -Version %opencover_version% -OutputDirectory packages
  - nuget install CodecovUploader -Version %codecov_uploader_version% -OutputDirectory packages
  - nuget install ReportGenerator -Version %report_generator_version% -OutputDirectory packages
  - dotnet restore %APPVEYOR_PROJECT_NAME%.slnx

configuration:
  - Debug
  - Release

build:
  project: $(APPVEYOR_PROJECT_NAME).slnx

after_build:
  - ps: |
      $folder = Get-ChildItem -Path packages/dlebansais.Packager.* -Name | Out-String    # Get the installation folder (we don't know the actual version)
      $firstline = ($folder -split '\r\n')[0]                                            # Get rid of carriage-return
      $fullpath = ".\packages\$firstline\tools\net10.0-windows7.0\Packager.exe"          # Build full path
      $options = $env:CUSTOM_PACKAGER_OPTIONS | ConvertFrom-Json                         # Get options as JSON array
      if ($env:CONFIGURATION -eq 'Release') {
        & $fullpath $options --prefix=$env:PACKAGE_PREFIX                                # Execute the packager: the output is nuget\%PACKAGE_PREFIX%.%APPVEYOR_PROJECT_NAME%.nuspec
        if ($LastExitCode -ne 0) { exit 1 }
        nuget pack "nuget\$env:PACKAGE_PREFIX.$env:APPVEYOR_PROJECT_NAME.nuspec"
      } else {
        & $fullpath $options --prefix=$env:PACKAGE_PREFIX --debug                        # Execute the packager: the output is nuget-debug\%PACKAGE_PREFIX%.%APPVEYOR_PROJECT_NAME%-Debug.nuspec
        if ($LastExitCode -ne 0) { exit 1 }
        nuget pack "nuget-debug\$env:PACKAGE_PREFIX.$env:APPVEYOR_PROJECT_NAME-Debug.nuspec"
      }
      $xml = [xml](Get-Content .\$env:APPVEYOR_PROJECT_NAME\$env:APPVEYOR_PROJECT_NAME.csproj)
      $version=$xml.Project.PropertyGroup.Version
      set version_tag v$version
      $version_tag=$version_tag.Trim()
      $env:VERSION_TAG=$version_tag
  - echo Version is "%VERSION_TAG%"

test_script:
  # One run per target framework, so that each writes its own coverage report. Tests run on master only: a deployment
  # build packages code that master has already tested.
  - if not '%APPVEYOR_REPO_BRANCH%' == 'deployment' dotnet test --project ./Test/%APPVEYOR_PROJECT_NAME%.Test/%APPVEYOR_PROJECT_NAME%.Test.csproj -c %CONFIGURATION% -p:Platform=x64 -f net481 --no-build --output detailed --coverage --coverage-output-format cobertura --coverage-output Coverage-%APPVEYOR_PROJECT_NAME%-net481.xml --results-directory TestResults
  - if not '%APPVEYOR_REPO_BRANCH%' == 'deployment' dotnet test --project ./Test/%APPVEYOR_PROJECT_NAME%.Test/%APPVEYOR_PROJECT_NAME%.Test.csproj -c %CONFIGURATION% -p:Platform=x64 -f net10.0 --no-build --output detailed --coverage --coverage-output-format cobertura --coverage-output Coverage-%APPVEYOR_PROJECT_NAME%-net10.0.xml --results-directory TestResults

after_test:
  - ps: if ($env:APPVEYOR_REPO_BRANCH -ne 'deployment') { Get-Content TestResults/Coverage-*.xml -Head 3 }
  # Codecov merges the reports uploaded for the same commit.
  - if '%CONFIGURATION%' == 'Debug' if '%APPVEYOR_REPO_BRANCH%' == 'master' .\packages\CodecovUploader.%codecov_uploader_version%\Tools\codecov.exe -f "TestResults\Coverage-%APPVEYOR_PROJECT_NAME%-net481.xml" -f "TestResults\Coverage-%APPVEYOR_PROJECT_NAME%-net10.0.xml"

artifacts:
  - path: $(PACKAGE_PREFIX).$(APPVEYOR_PROJECT_NAME)-Debug.*.nupkg
    name: $(APPVEYOR_PROJECT_NAME)-Package-Debug
  - path: $(PACKAGE_PREFIX).$(APPVEYOR_PROJECT_NAME).*.nupkg
    name: $(APPVEYOR_PROJECT_NAME)-Package-Release

deploy:
  - provider: GitHub
    release: $(VERSION_TAG)
    description: 'Automatic deployment'
    auth_token:
      secure: wGFKd2yoaaq7+B6Evl2OZeePPHUzTDlYnDf7DCH26mJZc/nrYGjQ5XGiTZfTWmvW
    artifact: $(APPVEYOR_PROJECT_NAME)-Package-Release
    draft: false
    prerelease: false
    force_update: true
    on:
      branch: deployment
      configuration: Release
  - provider: GitHub
    release: $(VERSION_TAG)
    description: 'Automatic deployment'
    auth_token:
      secure: wGFKd2yoaaq7+B6Evl2OZeePPHUzTDlYnDf7DCH26mJZc/nrYGjQ5XGiTZfTWmvW
    artifact: $(APPVEYOR_PROJECT_NAME)-Package-Debug
    draft: false
    prerelease: false
    force_update: true
    on:
      branch: deployment
      configuration: Debug
  - provider: NuGet
    server: https://nuget.pkg.github.com/dlebansais/index.json
    symbol_server: https://nuget.pkg.github.com/dlebansais/index.json
    artifact: $(APPVEYOR_PROJECT_NAME)-Package-Debug
    username: dlebansais
    api_key:
      secure: 7DLdeObgZf+PG3CwBCFWr2UvW6IFBF4Lwa0SUxFeQbkWr6DJSwNPFDwuKXgX8Wfy
    on:
      branch: deployment
      configuration: Debug
  - provider: NuGet
    server: https://nuget.pkg.github.com/dlebansais/index.json
    artifact: $(APPVEYOR_PROJECT_NAME)-Package-Release
    skip_symbols: true
    username: dlebansais
    api_key:
      secure: 7DLdeObgZf+PG3CwBCFWr2UvW6IFBF4Lwa0SUxFeQbkWr6DJSwNPFDwuKXgX8Wfy
    on:
      branch: deployment
      configuration: Release

# nuget.org only accepts Trusted Publishing from GitHub Actions: the Windows Release job of a deployment build starts
# the publish-nuget.yml workflow, which waits until this whole build has succeeded, then pushes the packages attached
# to the GitHub release.
on_success:
  - ps: |
      if ($env:APPVEYOR_REPO_BRANCH -eq 'deployment' -and $env:CONFIGURATION -eq 'Release') {
        $body = @{
          event_type = 'appveyor-deployment'
          client_payload = @{
            tag = $env:VERSION_TAG
            appveyor_account = $env:APPVEYOR_ACCOUNT_NAME
            appveyor_project = $env:APPVEYOR_PROJECT_SLUG
            appveyor_build = $env:APPVEYOR_BUILD_VERSION
            package_prefix = $env:PACKAGE_PREFIX
          }
        } | ConvertTo-Json
        $headers = @{
          Authorization = "Bearer $env:GITHUB_DEPLOY_TOKEN"
          Accept = 'application/vnd.github+json'
          'X-GitHub-Api-Version' = '2022-11-28'
        }
        Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:APPVEYOR_REPO_NAME/dispatches" -Headers $headers -Body $body -ContentType 'application/json'
        Write-Host "Started nuget.org publishing of $env:VERSION_TAG."
      }
